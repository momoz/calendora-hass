blueprint:
  name: Calendora — shopping list when you arrive at the shop
  description: >-
    When somebody arrives at a shop, send them the list on their phone with a
    button next to every item. Tapping one ticks it off in Calendora, so
    everybody else's list updates while they are still standing in the aisle.


    You need: a Calendora list, a person, and the Home Assistant Companion app
    on their phone with notifications turned on.


    Nothing is ticked off automatically — the notification is a reminder with
    buttons, not an assistant that guesses.
  domain: automation
  source_url: https://github.com/momoz/calendora-hass/blob/main/blueprints/automation/calendora/shopping_list_on_arrival.yaml
  homeassistant:
    min_version: "2026.7.0"
  input:
    person:
      name: Who
      description: The person this applies to. They get the notification.
      selector:
        entity:
          filter:
            - domain: person
    shop_zone:
      name: The shop
      description: >-
        The zone to watch. Create one in Settings → Areas & Zones if the shop is
        not there yet.
      selector:
        entity:
          filter:
            - domain: zone
    todo_entity:
      name: The list
      description: Which Calendora list to send.
      selector:
        entity:
          filter:
            - integration: calendora
              domain: todo
    notify_service:
      name: Their phone
      description: >-
        The notification action for their phone — pick the one named after
        their device.


        This has to be the mobile-app action rather than a notify entity,
        because only the action accepts the buttons this blueprint attaches.
      selector:
        action:
    batch_size:
      name: How many items to show
      description: >-
        Phones limit how many buttons a notification can carry. Three is the
        safe number on iOS; Android manages more.
      default: 3
      selector:
        number:
          min: 1
          max: 10
          mode: slider
    dwell_minutes:
      name: How long they must stay
      description: >-
        Sends only once somebody has been at the shop this long, rather than the
        moment they arrive. Two minutes is enough that a red light outside, a
        petrol stop next door and a drop-off in the car park never trigger it.


        Verified: arriving and leaving again after thirty seconds never sends,
        and stepping outside restarts the clock rather than firing early.
      default: 2
      selector:
        number:
          min: 1
          max: 15
          unit_of_measurement: minutes
          mode: slider
    quiet_from:
      name: Quiet from
      description: Nothing is sent after this time.
      default: "21:30:00"
      selector:
        time:
    quiet_until:
      name: Quiet until
      description: >-
        Nothing is sent before this time. A shop open at midnight is a shop you
        are at on purpose.
      default: "07:00:00"
      selector:
        time:

# `!input` is a YAML tag, not a template value: it cannot be used inside {{ }}.
# Every input that a template needs is bound to a variable here first. Getting
# this wrong is the single most common blueprint bug, and it fails at runtime
# rather than at import.
variables:
  list_entity: !input todo_entity
  person_entity: !input person
  item_limit: !input batch_size
  quiet_from: !input quiet_from
  quiet_until: !input quiet_until
  # A tag unique to this person and list, so two people shopping at once do not
  # overwrite each other's notification, and arriving twice replaces rather
  # than duplicates.
  notification_tag: "calendora-{{ person_entity | replace('.', '-') }}-{{ list_entity | replace('.', '-') }}"

# Verified on a real iPhone, 2026-08-07. Recorded here because every one of
# these was either guessed wrong or unknown beforehand:
#
#   - `sfsymbols:` icons DO render on actions, and vary per notification —
#     the same action id showed a different symbol on the next send.
#   - A same-tag replacement re-alerts AND updates the card in place. No
#     clear-and-resend dance, and no time-sensitive override needed.
#   - Tapping an action DISMISSES the notification. A three-item list is not
#     three taps; each tap needs a fresh send to show what is left.
#   - **Never set `push.category` to a name the Companion app has not
#     registered.** With one set, no action buttons render at all — silently,
#     with no error anywhere. Nothing here sets one; do not add one.
#   - With the phone locked and an Apple Watch present, delivery goes to the
#     watch and the phone stays silent.
#   - iOS hides notification content on a locked phone until the user
#     authenticates. Previews must be turned on per-app or this looks broken.
#
# NOT verified: whether one automation can write to two Android notification
# channels with different importance. No working Android device was available.
# Do not build a low-importance completion channel as though it is confirmed.

mode: single
max_exceeded: silent

triggers:
  # 2026.7 zone triggers, targeting the zone rather than the person's state.
  # The removed `person` device triggers are not used here.
  # The 2026.7 purpose-specific trigger, because it is the only one that takes
  # `for` — the legacy `zone` trigger rejects it outright. Verified on a real
  # Home Assistant: the dwell suppresses a drive-past, and re-entry restarts the
  # clock rather than firing early. It does NOT survive a restart: a restart
  # mid-dwell cancels the timer silently and the person must arrive again.
  - trigger: zone.entered
    target:
      entity_id: !input person
    options:
      zone: !input shop_zone
      for: >-
        {{ dwell_minutes }}
      behavior: each
    id: arrived

  # The buttons come back as this event, carrying the item id we put in the
  # action name. Home Assistant does not route it to the automation that sent
  # the notification, so the tag check below is what keeps one household's
  # notifications from ticking off another's items.
  - trigger: event
    event_type: mobile_app_notification_action
    id: ticked

conditions: []

actions:
  - choose:
      # ---------------------------------------------------------------- arrival
      - conditions:
          - condition: trigger
            id: arrived
          # Outside these hours nothing is sent at all. An automation that
          # wakes a household at midnight gets switched off and never switched
          # back on.
          - condition: time
            after: !input quiet_until
            before: !input quiet_from
        sequence:
          - variables:
              # Only what is still outstanding. A list of ticked items is not
              # worth a notification.
              outstanding: >-
                {{ (state_attr(list_entity, 'items') or [])
                   | selectattr('status', 'eq', 'needs_action')
                   | list }}
          - condition: template
            value_template: "{{ outstanding | count > 0 }}"
          - variables:
              showing: "{{ outstanding[:item_limit | int] }}"
              remaining: "{{ (outstanding | count) - (item_limit | int) }}"
          - action: !input notify_service
            data:
              title: >-
                {{ state_attr(list_entity, 'friendly_name') or 'Shopping list' }}
              message: >-
                {{ showing | map(attribute='summary') | join(', ') }}
                {%- if remaining > 0 %} and {{ remaining }} more{% endif %}
              data:
                tag: "{{ notification_tag }}"
                # Replaces a previous notification for this person and list
                # rather than stacking a second one.
                group: calendora-shopping
                # `sfsymbols:` on an action is verified to render, and to
                # change between sends rather than being cached with the
                # category.
                actions: >-
                  {{ showing | map(attribute='uid')
                     | map('regex_replace', '^', 'CALENDORA_TICK|')
                     | zip(showing | map(attribute='summary'))
                     | map('list') | list
                     | map('zip', ['action', 'title']) | map('list')
                     | map('items2dict') | list }}

      # ----------------------------------------------------------- button press
      - conditions:
          - condition: trigger
            id: ticked
          - condition: template
            value_template: >-
              {{ trigger.event.data.action is defined
                 and trigger.event.data.action.startswith('CALENDORA_TICK|') }}
          # Only respond to our own notification. Without this, every automation
          # built from this blueprint reacts to every button press in the house.
          - condition: template
            value_template: >-
              {{ trigger.event.data.tag | default('') == notification_tag }}
        sequence:
          - variables:
              # The item id travels in the action name, because the event does
              # not carry anything else we control.
              item_id: >-
                {{ trigger.event.data.action.split('|', 1)[1] }}
          - action: todo.update_item
            target:
              entity_id: !input todo_entity
            data:
              item: "{{ item_id }}"
              status: completed

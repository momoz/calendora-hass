blueprint:
  name: Calendora — shopping list when you arrive at the shop
  description: >-
    When somebody has been at a shop for a couple of minutes, send them the
    list with buttons to tick it off. Tapping ticks the items in Calendora, so
    everybody else's list updates while they are still in the aisle.


    You need: a Calendora list, a person with the Home Assistant Companion app,
    and a zone for the shop. That person must also be turned on for shop
    notifications in the Calendora integration's options — this automation
    checks before it sends anything.


    Nothing is ticked automatically. The notification is a reminder with
    buttons, not an assistant that guesses.
  domain: automation
  source_url: https://github.com/momoz/calendora-hass/blob/main/blueprints/automation/calendora/shopping_list_on_arrival.yaml
  homeassistant:
    min_version: "2026.7.0"
  input:
    person:
      name: Who
      description: Their Home Assistant person. Their location is what fires this.
      selector:
        entity:
          filter:
            - domain: person
    calendora_member:
      name: Which member is this, in Calendora
      description: >-
        Pick any one of that person's Calendora entities — their calendar or
        their next-event sensor will do. This automation reads their identity
        and their opt-in from it.


        An entity picker rather than a box to type an id into, on purpose: a
        mistyped identifier fails silently, and the failure would be sending
        somebody's location-triggered shopping list to a person who declined it.
      selector:
        entity:
          filter:
            - integration: calendora
              domain:
                - calendar
                - sensor
                - binary_sensor
    shop_zone:
      name: The shop
      description: >-
        The zone to watch. Create one in Settings → Areas & Zones if the shop is
        not there yet.
      selector:
        entity:
          filter:
            - domain: zone
    todo_entity:
      name: The list
      description: Which Calendora list to send.
      selector:
        entity:
          filter:
            - integration: calendora
              domain: todo
    notify_device:
      name: Their phone
      description: >-
        The phone running the Home Assistant Companion app. If they wear an
        Apple Watch, this reaches the watch too — and that is the surface this
        is built for.
      # A DEVICE, not an action and not a text box, and this is the third
      # selector this input has had. The reasoning for each rejection matters
      # more than the answer:
      #
      #   `text:`   — forbidden by the design, and rightly: a mistyped service
      #               name fails silently at send time, hours after it was saved.
      #   `action:` — what shipped in 0.4.3, and it could never have worked.
      #               `ActionSelector` is "a selector of an action SEQUENCE",
      #               and its validator is `return data` — it checks nothing and
      #               hands back a LIST of action steps. Used under `action:`,
      #               which needs a service-name string, that is a type error
      #               Home Assistant only reports when a person presses save.
      #
      # There is no selector anywhere in Home Assistant that yields a service
      # name; all 43 were checked. So the service call was the wrong shape, not
      # the selector — and the answer is Home Assistant's own, from
      # `notify_leaving_zone.yaml`: pick the device, and use the mobile_app
      # device action, which resolves the notify service from the device's
      # webhook. Exact rather than guessed, and no name to mistype.
      #
      # ---------------------------------------------------------------------
      # THE KEY WAS RENAMED HERE, from `notify_service`, and §0 calls input
      # keys permanent. **This is not a precedent. Do not read it as one.**
      #
      # Home Assistant stores a blueprint automation's answers BY KEY, so a
      # rename silently breaks every automation built on the old one. It was
      # free exactly once: saving was the step that failed, so no automation
      # using `notify_service` could exist in any household, anywhere. That
      # window shut the moment 0.4.4 worked.
      #
      # If you are considering renaming an input key, the question is not
      # "was one renamed before". It is: **could any household have saved an
      # automation using the current key?** If the blueprint can be saved at
      # all, the answer is yes and the answer to the rename is no.
      # ---------------------------------------------------------------------
      selector:
        device:
          filter:
            - integration: mobile_app
    batch_size:
      name: How many items to show
      description: >-
        A long list does not fit a watch face, and the rest are counted rather
        than dropped.
      default: 5
      selector:
        number:
          min: 1
          max: 10
          mode: slider
    dwell_minutes:
      name: How long they must stay
      description: >-
        Sends only once somebody has been at the shop this long, rather than the
        moment they arrive. Two minutes is enough that a red light outside, a
        petrol stop next door and a drop-off in the car park never trigger it.


        Two minutes is the default. Leaving and coming back restarts the clock.
      # A duration rather than a number of minutes, and this is not cosmetic:
      # the trigger's `for` is validated with `cv.positive_time_period`, which
      # takes a duration and NOT a template. A number would be read as seconds.
      # See the trigger below for what this cost.
      #
      # The input KEY is unchanged, so §0's frozen interface is intact — the
      # same latitude `calendora_member` took when its selector moved from a
      # text box to an entity picker.
      default:
        minutes: 2
      selector:
        duration:
          enable_day: false
    revisit_hours:
      name: Don't send again for
      description: >-
        After a trip, stay quiet at this shop for this long. Stops a second
        notification when somebody nips out to the car and comes back.
      default: 2
      selector:
        number:
          min: 0
          max: 12
          unit_of_measurement: hours
          mode: slider
    send_completion_card:
      name: Confirm when the list is done (iPhone and Apple Watch)
      description: >-
        Sends one silent card when the last item is ticked off, so the trip ends
        with an answer rather than the list card simply vanishing. No buttons,
        no sound, no wake — on iOS it arrives at interruption level `passive`,
        which is set per notification and does not need a channel.


        **Leave this off on Android.** Android's equivalent is a second
        notification channel at low importance, an importance that is frozen
        when the channel is first created and cannot be corrected afterwards.
        Without it this card would arrive with a sound, and a buzz at the end of
        a shop to announce that the shop is over is worse than no card at all.


        Off by default for that reason: the default has to be the one that is
        safe on a phone this blueprint cannot identify.
      # The key is `send_completion_card` because that is what §0's PERMANENT
      # table names, and input keys are a public API — an automation built on
      # the wrong one breaks when it is corrected. This shipped as
      # `completion_card` and was renamed on 2026-08-09, which cost nothing
      # only because the blueprint had never loaded in anybody's house. There
      # was no working automation to break. That window is now closed.
      #
      # The DEFAULT differs from §0's `true`, and defaults are explicitly not
      # permanent. §10.3 is why: there is no completion card on Android, a
      # blueprint cannot tell which phone it is sending to, and defaulting this
      # on would hand an Android household the one send that section forbids.
      default: false
      selector:
        boolean:
    quiet_from:
      name: Quiet from
      description: Nothing is sent after this time.
      default: "21:30:00"
      selector:
        time:
    quiet_until:
      name: Quiet until
      description: >-
        Nothing is sent before this time. A shop open at midnight is a shop you
        are at on purpose.
      default: "07:00:00"
      selector:
        time:

# Verified on a real iPhone, 2026-08-07. Recorded here because each of these was
# either guessed wrong or unknown beforehand:
#
#   - `sfsymbols:` icons DO render on actions, and vary per notification.
#   - A same-tag replacement re-alerts AND updates the card in place.
#   - Tapping an action DISMISSES the notification. Progress can only be shown
#     by sending a fresh one — this is a send / tap / re-send loop.
#   - **Never set `push.category` to a name the Companion app has not
#     registered.** With one set, no action buttons render at all — silently,
#     with no error anywhere. Nothing here sets one; do not add one.
#   - A locked phone with a paired Apple Watch delivers to the watch, and the
#     watch shows full content even when the phone hides previews.
#   - Ticking an already-ticked item is a no-op, not an error. Verified against
#     the server, because two shoppers tapping the same thing is ordinary.
#
# DECIDED, not verified: there is no completion card on Android. Android is out
# of scope (2026-08-08) and the two-channel question is closed by decision
# rather than by test — see DESIGN-shop-arrival.md §10.3. Do not add a
# low-importance completion channel; an Android device turning up does not
# reopen this. On iOS the completion card is `interruption-level: passive`,
# which is per notification rather than per channel and needs no verification.
#
# NOT verified: whether per-action `action_data` comes back on the tap event.
# The tick path falls back to re-reading the list when it does not, which is
# correct while one message carries the whole list. It stops being correct once
# batching lands, so it needs a device test before then. The replacement card
# (§6) does NOT depend on it — a replacement rebuilds from `outstanding`, which
# is recomputed on every branch.

# `!input` is a YAML tag, not a template value: it cannot be used inside {{ }}.
# Every input a template needs is bound to a variable first. Getting this wrong
# is the most common blueprint bug, and it fails at runtime rather than import.
variables:
  list_entity: !input todo_entity
  person_entity: !input person
  member_entity: !input calendora_member
  shop_entity: !input shop_zone
  item_limit: !input batch_size
  revisit_window: !input revisit_hours
  send_completion_card: !input send_completion_card
  # §6, "the trip stops": 90 minutes. Not an input — §0 does not declare one and
  # this is not a knob a household should have to reason about. A number here
  # rather than a helper entity because the blueprint has nowhere to persist a
  # trip, and this needs nothing persisted: it is derived from when this
  # automation last did something.
  trip_expiry_seconds: 5400
  # One tag for the whole trip, so a shopper never has more than one of these in
  # the shade and every send replaces the last.
  notification_tag: "calendora_shop_{{ person_entity.split('.')[1] }}"

mode: single
max_exceeded: silent

triggers:
  # The 2026.7 purpose-specific trigger, because it is the only one that takes
  # `for` — the legacy `zone` trigger rejects it outright. It does NOT survive a
  # restart: a restart mid-dwell cancels the timer silently and the person has
  # to arrive again. We do not detect that or apologise for it.
  - trigger: zone.entered
    target:
      entity_id: !input person
    options:
      zone: !input shop_zone
      # `!input` directly, NOT `{{ dwell_minutes }}`.
      #
      # This line read `for: "{{ dwell_minutes }}"` from the day the blueprint
      # was written until 2026-08-09, and in that form **the whole automation
      # failed to load** — not the dwell, the automation. `for` is validated
      # with `cv.positive_time_period`, which accepts a duration and no
      # template at all, so the string was rejected at config validation and
      # Home Assistant discarded the automation with one line in the log.
      #
      # The comment above `variables:` warns that an input a template needs
      # must be bound to a variable first. That is true and it is not enough:
      # a trigger cannot see `variables:` either, and this field could not have
      # taken a template even if it could. There was no version of the template
      # approach that worked here.
      #
      # It went unnoticed because nothing executed the blueprint — every test
      # read the YAML. `tests/test_shop_blueprint_behaviour.py` now builds the
      # automation inside Home Assistant, which is what found this.
      for: !input dwell_minutes
      behavior: each
    id: arrived

  # The buttons come back as this event. Home Assistant does not route it to the
  # automation that sent the notification, so the tag check in each branch is
  # what stops one household's automation acting on another's tap.
  - trigger: event
    event_type: mobile_app_notification_action
    id: tapped

conditions: []

actions:
  # THE LIST IS FETCHED, NOT READ FROM AN ATTRIBUTE.
  #
  # `state_attr(list_entity, 'items')` returns None. A Home Assistant to-do
  # entity does not publish its items as a state attribute — the state is a
  # count, the attributes are whatever the integration adds (here `list_id`,
  # `list_type`, `section_count`), and **the items come from the `todo.get_items`
  # action with a response variable**. Verified against a live instance: that
  # entity has no `items` attribute and never did.
  #
  # This blueprint read the attribute from the day it was written, so
  # `outstanding` was always empty, so the arrival card could never send and a
  # tap could never tick anything. Nobody saw it because no household had the
  # blueprint until 2026-08-10.
  #
  # The tests did not see it because they FABRICATED the attribute —
  # `hass.states.async_set(TODO_ENTITY, n, {"items": [...]})` — inventing a state
  # shape this integration does not produce. The author supplied the input again,
  # and this time it was the shape of his own entity.
  - action: todo.get_items
    target:
      entity_id: !input todo_entity
    data:
      status: needs_action
    response_variable: todo_result

  - variables:
      # Recomputed on every branch, so a tap acts on the list as it stands
      # rather than as it was when the card was sent.
      outstanding: "{{ todo_result[list_entity]['items'] }}"
      showing: "{{ outstanding[:item_limit | int] }}"
      remaining: "{{ (outstanding | count) - (outstanding[:item_limit | int] | count) }}"
      shop_name: >-
        {{ (state_attr(shop_entity, 'friendly_name') or 'The shop')
           | truncate(18, true, '') }}
      list_name: "{{ state_attr(list_entity, 'friendly_name') or 'List' }}"
      deep_link: >-
        /lists/{{ state_attr(list_entity, 'list_id') }}?mode=shopping

  - choose:
      # ---------------------------------------------------------------- arrival
      - conditions:
          - condition: trigger
            id: arrived

          # The opt-in, checked by the thing that does the sending. Without this
          # the switch in the integration's options would be decorative, and
          # somebody who declined would get a notification triggered by their
          # own location.
          - condition: template
            value_template: >-
              {{ state_attr(member_entity, 'shop_notifications') is true }}

          # Never announce an absence of work. An empty list and a list already
          # ticked are the same thing here, and both are silence.
          - condition: template
            value_template: "{{ outstanding | count > 0 }}"

          # Nothing within the revisit window. Somebody who goes back to the car
          # for a bag-for-life has not started a second trip.
          #
          # Measured from this automation's own last run, which includes the
          # taps during a trip — deliberately, because "two hours since you were
          # last shopping here" is the question worth asking.
          - condition: template
            value_template: >-
              {{ revisit_window | float(0) == 0
                 or this.attributes.last_triggered is none
                 or (now() - this.attributes.last_triggered).total_seconds()
                    > revisit_window | float(0) * 3600 }}

          # Outside these hours nothing is sent. An automation that wakes a
          # household at midnight gets switched off and never switched back on.
          - condition: time
            after: !input quiet_until
            before: !input quiet_from
        sequence:
          # `&shop_card` — this exact node is sent again by the ticking branch
          # below (§6, "your own tap → replacement immediately"). A YAML anchor
          # rather than a second copy, because it is not a second card: it is
          # THE card, re-sent against a shorter list. Two copies would drift,
          # and a replacement that has quietly stopped matching the arrival is
          # the kind of thing nobody notices until a shopper is standing in an
          # aisle looking at a button that is not there any more.
          #
          # Every value below reads `outstanding`, `showing` and `remaining`,
          # which the ticking branch rebinds to the post-tap list before it
          # sends this. That is what the comment at the top of `actions:` means
          # by "a tap acts on the list as it stands".
          - &shop_card
            # `domain`/`type`/`device_id` is a DEVICE ACTION, not a service
            # call. mobile_app resolves the right notify service from the
            # device, so nothing here names a service and nothing can mistype
            # one. `title`, `message` and `data` sit at this level rather than
            # nested under `data:` — that is the device action's own schema.
            domain: mobile_app
            type: notify
            device_id: !input notify_device
            # The title must stand alone: it is the whole short look on a
            # watch, and on a locked iPhone with previews hidden it is all
            # there is. Nothing load-bearing lives below it.
            title: >-
              {{ shop_name }} —
              {{ 'last one' if outstanding | count == 1
                 else (outstanding | count) ~ ' things' }}
            # The second sentence is designed to be cut off. Android collapses
            # to one line and the watch long look cuts around there, so it is
            # a separate sentence rather than a clause.
            message: >-
              {{ showing | map(attribute='summary') | join(', ') }}.
              {%- if remaining > 0 %} Then {{ remaining }} more.{% endif %}
            data:
              # iOS and watchOS only; Android drops it.
              subtitle: "{{ list_name }}"
              tag: "{{ notification_tag }}"
              group: calendora-shopping
              # Not time-sensitive. A shopping list is not allowed to break
              # somebody's Focus.
              push:
                interruption-level: active
                # §8: one thread per person per trip, so a shop does not
                # interleave with the door sensor and the washing machine in
                # the notification centre. iOS and watchOS only; Android
                # groups on `group` below.
                thread-id: "{{ notification_tag }}"
              # On Android the channel is the mute switch, and that is the
              # point: a family can silence this without silencing their
              # smart home.
              channel: Shopping list
              notification_icon: "mdi:cart"
              # Tapping the card is the iPhone's primary action, because the
              # expand gesture that reveals buttons is unreliable. The deep
              # link has to open ready to tick.
              url: "{{ deep_link }}"
              clickAction: "{{ deep_link }}"
              action_data:
                item_ids: "{{ showing | map(attribute='uid') | list }}"
              # Four identifiers, fixed labels, same order every send. Labels
              # never name their contents — the body does that — which is what
              # keeps the set stable while the contents change. Android shows
              # the first three and drops the fourth, which is why the deep
              # link is also on the card itself.
              actions:
                - action: CALENDORA_SHOP_GOT_BATCH
                  title: Got these
                  icon: "sfsymbols:checkmark"
                - action: CALENDORA_SHOP_GOT_ALL
                  title: Got the rest
                  icon: "sfsymbols:checkmark.circle.fill"
                - action: CALENDORA_SHOP_STOP
                  title: Not shopping
                  icon: "sfsymbols:xmark"
                - action: CALENDORA_SHOP_OPEN
                  title: Open list
                  icon: "sfsymbols:list.bullet"
                  uri: "{{ deep_link }}"

      # ------------------------------------------------------------------ stop
      - conditions:
          - condition: trigger
            id: tapped
          - condition: template
            value_template: >-
              {{ trigger.event.data.action | default('') == 'CALENDORA_SHOP_STOP' }}
          - condition: template
            value_template: >-
              {{ trigger.event.data.tag | default('') == notification_tag }}
          # §6: the trip stops after 90 minutes. A card left in the shade when
          # somebody abandons a trip keeps its buttons — tap "Got these"
          # tomorrow morning and it ticks tomorrow's list off yesterday's card,
          # silently. This is the stop condition that closes that.
          #
          # `this.attributes.last_triggered` is the time of the PREVIOUS run,
          # not this one: `Script.async_run` stamps it when the ACTION script
          # starts, and `this` is captured before that. Verified rather than
          # assumed — the revisit window below relies on the same fact, and it
          # had never been tested either.
          #
          # **This measures 90 minutes since the last thing that happened on
          # this trip, not since arrival**, which is a deliberate deviation from
          # §6's wording. A shopper still tapping at 100 minutes is still
          # shopping; one who has not tapped for 90 is not. Cutting off an
          # active trip to honour the letter of the rule would be the worse
          # reading of it.
          - condition: template
            value_template: >-
              {{ this.attributes.last_triggered is not none
                 and (now() - this.attributes.last_triggered).total_seconds()
                     <= trip_expiry_seconds }}
        sequence:
          # Clear the card first: the trip is over, and leaving it in the shade
          # invites a tap that no longer means anything.
          - domain: mobile_app
            type: notify
            device_id: !input notify_device
            message: clear_notification
            data:
              tag: "{{ notification_tag }}"

          # Then sleep until midnight. `mode: single` does the rest — every
          # later trigger at this zone, arrival or tap, is dropped silently
          # while this runs. That is "silent at that zone until midnight" with
          # no helper entity and nothing persisted.
          #
          # A restart clears it, which matches the rest of the design: we do not
          # detect a missed dwell either, and guessing is how this gets
          # uninstalled.
          - delay: >-
              {{ [ (today_at('23:59:59') - now()).total_seconds() | int, 1 ] | max }}

      # -------------------------------------------------------------- ticking
      - conditions:
          - condition: trigger
            id: tapped
          - condition: template
            value_template: >-
              {{ trigger.event.data.action | default('') in
                 ['CALENDORA_SHOP_GOT_BATCH', 'CALENDORA_SHOP_GOT_ALL'] }}
          - condition: template
            value_template: >-
              {{ trigger.event.data.tag | default('') == notification_tag }}
          # §6: the trip stops after 90 minutes. A card left in the shade when
          # somebody abandons a trip keeps its buttons — tap "Got these"
          # tomorrow morning and it ticks tomorrow's list off yesterday's card,
          # silently. This is the stop condition that closes that.
          #
          # `this.attributes.last_triggered` is the time of the PREVIOUS run,
          # not this one: `Script.async_run` stamps it when the ACTION script
          # starts, and `this` is captured before that. Verified rather than
          # assumed — the revisit window below relies on the same fact, and it
          # had never been tested either.
          #
          # **This measures 90 minutes since the last thing that happened on
          # this trip, not since arrival**, which is a deliberate deviation from
          # §6's wording. A shopper still tapping at 100 minutes is still
          # shopping; one who has not tapped for 90 is not. Cutting off an
          # active trip to honour the letter of the rule would be the worse
          # reading of it.
          - condition: template
            value_template: >-
              {{ this.attributes.last_triggered is not none
                 and (now() - this.attributes.last_triggered).total_seconds()
                     <= trip_expiry_seconds }}
        sequence:
          - variables:
              # "Got the rest" means everything outstanding. "Got these" means
              # what the card named — which arrives in the tap's payload if the
              # platform returns it, and otherwise falls back to the same slice
              # the card was built from. That fallback is correct while one
              # message carries the whole list; it stops being correct when
              # batching lands, which is why the payload needs a device test.
              #
              # `.get('action_data', {}).get('item_ids')` rather than
              # `.action_data.item_ids | default(...)`. The dotted form looks
              # equivalent and is not: with no `action_data` on the event, the
              # attribute lookup raises before `default` is ever reached, the
              # whole branch aborts, and a tap ticks NOTHING and sends nothing.
              # So the fallback that exists for the case where the platform
              # omits `action_data` was itself broken by that exact case —
              # written 2026-08-07, found 2026-08-09 by the first test that ran
              # the blueprint instead of reading it.
              ticking: >-
                {% if trigger.event.data.action == 'CALENDORA_SHOP_GOT_ALL' %}
                  {{ outstanding | map(attribute='uid') | list }}
                {% else %}
                  {{ trigger.event.data.get('action_data', {}).get('item_ids')
                     | default(showing | map(attribute='uid') | list, true) }}
                {% endif %}

          - repeat:
              for_each: "{{ ticking }}"
              sequence:
                # Ticking something already ticked is a no-op rather than an
                # error — verified against the server, because two shoppers
                # tapping the same item is the ordinary case, not the edge one.
                - action: todo.update_item
                  target:
                    entity_id: !input todo_entity
                  data:
                    item: "{{ repeat.item }}"
                    status: completed

          # ------------------------------------------- something comes back
          #
          # §6: "Your own tap → replacement immediately, always, no debounce.
          # The tap dismissed the card; something has to come back." That row is
          # the only one in the send matrix with neither a debounce nor a cap,
          # and it is the line the whole loop rests on — a tap that produces
          # silence reads as a tap that did not take.
          #
          # The list is rebound rather than re-read. Re-reading would race the
          # state machine: the `todo.update_item` calls above have returned, but
          # there is no guarantee the list entity has settled, and a card that
          # arrives only sometimes is worse than one that never arrives.
          # Subtracting what this tap ticked is exact for the shopper's own tap,
          # which is the only tap this branch handles.
          #
          # Another shopper ticking concurrently makes this optimistic, never
          # wrong in the other direction — and §6 already says somebody else's
          # tick rides your next replacement rather than pushing on its own.
          #
          # These three names are the ones `&shop_card` reads. Rebinding them
          # here is what makes the replacement the same card against a shorter
          # list rather than a second card that has to be kept in step.
          - variables:
              outstanding: >-
                {{ outstanding | rejectattr('uid', 'in', ticking) | list }}
              showing: "{{ outstanding[:item_limit | int] }}"
              remaining: "{{ (outstanding | count) - (outstanding[:item_limit | int] | count) }}"

          - if:
              - condition: template
                value_template: "{{ outstanding | count > 0 }}"
            then:
              # Not gated on quiet hours, and that is deliberate. §7 exists to
              # stop this making a noise for something the person did not do;
              # this is the answer to a tap they made a second ago. A shopper
              # who is still in the shop at 21:31 has not stopped shopping.
              - *shop_card

            # ----------------------------------------------- the trip is over
            #
            # DESIGN-shop-arrival.md §10.3. The one send the shopper did not
            # ask for, and it exists for the same reason as the replacement:
            # the tap dismissed the card, and with nothing left to replace it
            # with, the last tap of a shop would be followed by nothing at all.
            # That is worth a silent card. It is not worth a sound.
            else:
              # Off by default, unlike the replacement above, which always
              # sends. The difference is Android: a replacement is a normal
              # notification on any platform, while this one is only tolerable
              # silent, and on Android it cannot be (§10.3).
              - if:
                  - condition: template
                    value_template: "{{ send_completion_card }}"
                then:
                  - domain: mobile_app
                    type: notify
                    device_id: !input notify_device
                    # The whole message is the title, because the title is the
                    # whole short look on a watch and this card has nothing
                    # below it worth expanding for.
                    title: "{{ shop_name }} — that's the lot"
                    message: "{{ list_name }} is clear."
                    data:
                      # Same tag as the trip card, so this REPLACES whatever
                      # is left in the shade rather than stacking beside it. A
                      # shopper never has more than one of these.
                      tag: "{{ notification_tag }}"
                      subtitle: "{{ list_name }}"
                      push:
                        # What the Android quiet channel was for, done per
                        # notification instead of per channel — no channel to
                        # create, no importance frozen at creation, nothing to
                        # verify on a device. §10.3.
                        interruption-level: passive
                        # §8: these stack apart from every other Home
                        # Assistant notification, per person per trip.
                        thread-id: "{{ notification_tag }}"
                    # No `actions:` and no `channel:`, both deliberate. §6 —
                    # "List cleared: one card, no buttons, silent." There is
                    # nothing left to tick, so a button could only be a way to
                    # get this wrong.
